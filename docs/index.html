<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Explainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f1a;
      color: #d4d4d4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    h1 {
      font-size: 32px;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #999;
      margin-bottom: 24px;
    }
    .links a {
      color: #8888cc;
      text-decoration: none;
      margin: 0 12px;
      font-size: 15px;
    }
    .links a:hover {
      text-decoration: underline;
      color: #aaaaee;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sentence Explainer</h1>
    <p>Highlight any text on a webpage, middle-click, and get an instant AI-powered explanation in context.</p>
    <div class="links">
      <a href="https://github.com/gg2411/Chrome-extension-" target="_blank">GitHub</a>
      <a href="/privacy">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
